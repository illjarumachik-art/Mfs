<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Гидравлический робот STEM Solar Robot на солнечной батарее 12 в 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="stage" aria-label="Продающая карточка STEM Solar Robot">
    <article class="card" id="sell-card">
      <img
        class="card__photo"
        src="../assets/stem-solar-power-scene-bg-1920x1080.jpg"
        alt="Солнечный квадробот STEM Solar Robot на балконе: свет падает на панель, рядом коробка набора и силуэт модели-пловца в воде"
        width="1920"
        height="1080"
      />

      <div class="card__veil" aria-hidden="true"></div>
      <div class="card__sun" aria-hidden="true"></div>

      <div class="card__content">
        <header class="card__copy">
          <p class="card__name">
            Гидравлический робот STEM Solar Robot на&nbsp;солнечной батарее 12&nbsp;в&nbsp;1
          </p>
          <h1 class="card__title">Робот, который движется от&nbsp;солнца</h1>
          <p class="card__subtitle">
            Без батареек: поставь модель под солнечный свет — и&nbsp;она поедет
          </p>
        </header>

        <ul class="card__features">
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="2"/>
                <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span>Работает от солнечной энергии</span>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 16.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M7 16.5V11l5-4 5 4v5.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M5.5 19c1.2-1.8 3.2-2.8 6.5-2.8s5.3 1 6.5 2.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span>Движется по ровной поверхности и по воде</span>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M8 4h3v3H8V4Zm5 0h3v3h-3V4ZM8 9h3v3H8V9Zm5 0h3v3h-3V9ZM4 14h3v3H4v-3Zm5 0h3v3H9v-3Zm5 0h3v3h-3v-3Zm5 0h3v3h-3v-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>12 моделей в одном наборе</span>
          </li>
        </ul>
      </div>
    </article>
  </main>
</body>
</html>
