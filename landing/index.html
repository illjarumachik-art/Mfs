<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STEM Solar Robot 12 в 1 — продающая карточка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="stage" aria-label="Продающая карточка STEM Solar Robot">
    <article class="card" id="sell-card">
      <img
        class="card__photo"
        src="../assets/stem-solar-robot-scene-bg-1920x1080.jpg"
        alt="Открытый набор STEM Solar Robot 12 в 1 и собранный солнечный квадробот на детском столе"
        width="1920"
        height="1080"
      />

      <div class="card__veil" aria-hidden="true"></div>
      <div class="card__sun" aria-hidden="true"></div>

      <div class="card__content">
        <header class="card__copy">
          <p class="card__eyebrow">STEM Solar Robot · 12 в 1</p>
          <h1 class="card__title">12 роботов — из&nbsp;одного набора</h1>
          <p class="card__subtitle">
            Собери, разбери и&nbsp;собери заново: каждый раз&nbsp;— новая модель,
            которая движется сама
          </p>
        </header>

        <div class="card__footer">
          <ul class="card__features">
            <li>
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M8 4h3v3H8V4Zm5 0h3v3h-3V4ZM8 9h3v3H8V9Zm5 0h3v3h-3V9ZM4 14h3v3H4v-3Zm5 0h3v3H9v-3Zm5 0h3v3h-3v-3Zm5 0h3v3h-3v-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <path d="M7 7.5 12 12l5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </span>
              <span>12 моделей в наборе</span>
            </li>
            <li>
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M7 3.5h8.5L19 7v13.5H7V3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <path d="M15 3.5V7h4M9.5 11h5M9.5 14.5h5M9.5 18h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </span>
              <span>Пошаговая схема сборки</span>
            </li>
            <li>
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/>
                  <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6.1 6.1l1.6 1.6M16.3 16.3l1.6 1.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </span>
              <span>Работает от солнца</span>
            </li>
          </ul>

          <a class="card__cta" href="#order">Собрать своего робота</a>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
